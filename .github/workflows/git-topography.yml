name: Generate Git topography

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/build_git_topography.py"
      - ".github/workflows/git-topography.yml"

permissions:
  contents: write

concurrency:
  group: git-topography
  cancel-in-progress: true

jobs:
  terrain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Generate contribution terrain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_git_topography.py
      - name: Commit updated terrain
        run: |
          if git diff --quiet -- assets/git-topography.svg; then
            echo "Contribution terrain is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add assets/git-topography.svg
          git commit -m "chore: refresh git contribution topography"
          git push
