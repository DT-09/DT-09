<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="t d">
<title id="t">DT—09 — Wonder awaits</title>
<desc id="d">A cinematic, Interstellar-inspired black hole sits partly beyond the upper-right edge, with a sharply tilted glowing accretion disc and gravitationally lensed light. Large animated editorial typography anchors the left.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030305"/><stop offset=".58" stop-color="#08090D"/><stop offset="1" stop-color="#161B26"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#D47A3B" stop-opacity=".2"/><stop offset=".55" stop-color="#161B26" stop-opacity=".14"/><stop offset="1" stop-color="#030305" stop-opacity="0"/></radialGradient>
 <linearGradient id="disc" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#7D3B24" stop-opacity=".08"/><stop offset=".26" stop-color="#D47A3B"/><stop offset=".48" stop-color="#FFE4BE"/><stop offset=".64" stop-color="#F9AD6A"/><stop offset="1" stop-color="#8C452A" stop-opacity=".08"/></linearGradient>
 <radialGradient id="hole"><stop offset=".72" stop-color="#010103"/><stop offset=".86" stop-color="#030305"/><stop offset=".94" stop-color="#161B26"/><stop offset="1" stop-color="#030305"/></radialGradient>
 <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F5EDE4"/><stop offset=".62" stop-color="#F9AD6A"/><stop offset="1" stop-color="#D47A3B"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter><filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#F3E9DE" stroke-opacity=".03" stroke-width="1"/></pattern>
 <style>
 .brand{opacity:0;animation:brand-in 1.5s cubic-bezier(.16,1,.3,1) .15s forwards}
 .tagline{opacity:0;animation:rise-in 1.1s cubic-bezier(.16,1,.3,1) .9s forwards}
 .meta{opacity:0;animation:rise-in 1s ease-out 1.45s forwards}
 .hole-system{transform-origin:1370px 150px;animation:slow-drift 42s ease-in-out infinite alternate}
 .orbit{transform-origin:1370px 150px;animation:orbit 72s linear infinite}
 .flare{animation:flare 6s ease-in-out infinite}
 .stars circle{animation:twinkle 4s ease-in-out infinite alternate}
 @keyframes brand-in{0%{opacity:0;transform:translateY(28px);letter-spacing:34px}100%{opacity:1;transform:translateY(0);letter-spacing:5px}}
 @keyframes rise-in{0%{opacity:0;transform:translateY(16px);letter-spacing:8px}100%{opacity:1;transform:translateY(0);letter-spacing:3px}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes slow-drift{from{transform:translate(0,0) rotate(-1deg)}to{transform:translate(-8px,7px) rotate(1deg)}}
 @keyframes flare{0%,100%{opacity:.42}50%{opacity:.92}}
 @keyframes twinkle{from{opacity:.16}to{opacity:.8}}
 @media(prefers-reduced-motion:reduce){.brand,.tagline,.meta{opacity:1;animation:none}.hole-system,.orbit,.flare,.stars circle{animation:none}}
 </style>
</defs>
<rect width="1600" height="560" fill="url(#bg)"/><rect width="1600" height="560" fill="url(#grid)"/>
<ellipse cx="1320" cy="170" rx="470" ry="390" fill="url(#haze)"/>
<g class="stars" fill="#F5EDE4">
 <circle cx="72" cy="74" r="1.5"/><circle cx="420" cy="56" r="1.1"/><circle cx="640" cy="126" r="1.3"/>
 <circle cx="780" cy="455" r="1.2"/><circle cx="930" cy="68" r="1.1"/><circle cx="1480" cy="90" r="1.4"/>
 <circle cx="1510" cy="410" r="1.2"/><circle cx="136" cy="414" r="1.1"/><circle cx="510" cy="340" r="1.4"/>
 <circle cx="870" cy="260" r="1"/><circle cx="1320" cy="500" r="1.3"/><circle cx="290" cy="220" r="1"/>
</g>
<!-- Gravitational lensing and tilted accretion disc; the singularity is deliberately cropped by the frame. -->
<g class="hole-system">
 <g transform="translate(1370 150) rotate(-31)">
  <ellipse rx="390" ry="116" fill="none" stroke="#D47A3B" stroke-width="48" opacity=".14" filter="url(#glow)"/>
  <ellipse rx="365" ry="108" fill="none" stroke="url(#disc)" stroke-width="25" opacity=".72" filter="url(#soft)"/>
  <ellipse rx="348" ry="101" fill="none" stroke="url(#disc)" stroke-width="10" opacity=".96"/>
  <ellipse rx="310" ry="90" fill="none" stroke="#F9AD6A" stroke-width="2" opacity=".58"/>
  <ellipse rx="267" ry="78" fill="none" stroke="#FFE0B2" stroke-width="1.2" opacity=".35"/>
  <path d="M-350 0C-235 -120 -85 -145 40 -102C165 -58 270 -92 350 -6" fill="none" stroke="#FFE6C8" stroke-width="4" opacity=".72" filter="url(#soft)"/>
  <path d="M-330 5C-190 112 -35 140 105 92C215 54 285 78 330 3" fill="none" stroke="#D47A3B" stroke-width="3" opacity=".55" filter="url(#soft)"/>
  <circle r="100" fill="url(#hole)"/>
  <circle r="105" fill="none" stroke="#F9AD6A" stroke-opacity=".5" stroke-width="1.6"/>
  <ellipse rx="142" ry="42" fill="none" stroke="#D47A3B" stroke-width="1" opacity=".28"/>
 </g>
 <g class="orbit" fill="none" stroke="#F9AD6A" stroke-opacity=".25"><ellipse cx="1370" cy="150" rx="420" ry="205" stroke-dasharray="2 15"/><ellipse cx="1370" cy="150" rx="300" ry="270" stroke-dasharray="1 18"/></g>
 <path class="flare" d="M1080 190C1200 42 1400 8 1580 92" fill="none" stroke="#FFE0B2" stroke-width="2" opacity=".55" filter="url(#soft)"/>
</g>
<g class="brand">
 <text x="88" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="132" letter-spacing="5" fill="url(#word)">DT—09</text>
 <text x="98" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5" fill="#D47A3B">INDEPENDENT SYSTEMS ENGINEERING</text>
</g>
<g class="tagline">
 <text x="98" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-style="italic" fill="#F5EDE4">Wonder awaits.</text>
 <path d="M99 390H570" stroke="#D47A3B" stroke-opacity=".72"/>
</g>
<g class="meta">
 <text x="99" y="428" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#A6A7B0">APPLIED AI  /  SOFTWARE  /  DATA  /  ENGINEERING</text>
</g>
<path d="M70 510H1530" stroke="#161B26" stroke-width="1"/>
<text x="72" y="538" fill="#777B87" font-family="monospace" font-size="10" letter-spacing="2">CURIOSITY → MODELS → SYSTEMS → EVIDENCE</text>
<text x="1528" y="538" fill="#777B87" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="2">EST. IN PROGRESS</text>
</svg>