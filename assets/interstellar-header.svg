<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">DT—09 — Independent systems engineering</title>
<desc id="desc">An abstract technical composition with layered orbital paths, precise linework and animated editorial typography. No black-hole imagery.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030305"/><stop offset=".58" stop-color="#0B0D13"/><stop offset="1" stop-color="#161B26"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D47A3B"/><stop offset=".55" stop-color="#F9AD6A"/><stop offset="1" stop-color="#F4D2B4"/></linearGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#D47A3B" stop-opacity="0"/><stop offset=".5" stop-color="#F9AD6A" stop-opacity=".75"/><stop offset="1" stop-color="#D47A3B" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#E9D9CC" stroke-opacity=".035"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <style>
 .wordmark{opacity:0;animation:enter 1.25s cubic-bezier(.16,1,.3,1) .15s forwards}
 .reveal{clip-path:inset(0 100% 0 0);animation:type 3.2s steps(38,end) 1.05s forwards}
 .cursor{animation:blink .85s steps(2,start) infinite}
 .path-a{stroke-dasharray:9 15;animation:dash 34s linear infinite}
 .path-b{stroke-dasharray:2 13;animation:dash 48s linear infinite reverse}
 .pulse{animation:pulse 6s ease-in-out infinite}
 @keyframes enter{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(25px)}}
 @keyframes type{to{clip-path:inset(0 0 0 0)}}
 @keyframes blink{to{opacity:0}}
 @keyframes dash{to{stroke-dashoffset:-600}}
 @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}
 @media(prefers-reduced-motion:reduce){.wordmark{opacity:1;animation:none}.reveal{clip-path:none;animation:none}.cursor,.path-a,.path-b,.pulse{animation:none}}
 </style>
</defs>
<rect width="1600" height="540" fill="url(#bg)"/><rect width="1600" height="540" fill="url(#grid)"/>
<g fill="none">
 <path d="M800 620C850 390 1060 120 1660 -50" stroke="#D47A3B" stroke-opacity=".2" stroke-width="1"/>
 <path d="M760 610C890 365 1130 180 1640 80" stroke="#F9AD6A" stroke-opacity=".13" stroke-width="1"/>
 <path d="M980 590C1020 360 1220 170 1610 150" stroke="#F9AD6A" stroke-opacity=".18" stroke-width="1"/>
 <path class="path-a" d="M700 610C830 390 1080 160 1650 -10" stroke="url(#line)" stroke-width="2"/>
 <path class="path-b" d="M860 600C950 370 1190 220 1640 120" stroke="#D47A3B" stroke-opacity=".45"/>
 <path d="M1050 0V540M1114 0V540M1178 0V540" stroke="#F5EDE4" stroke-opacity=".035"/>
</g>
<g class="pulse" fill="#F9AD6A"><circle cx="1049" cy="222" r="2"/><circle cx="1178" cy="166" r="2"/><circle cx="1334" cy="110" r="1.5"/><circle cx="1468" cy="76" r="1.5"/></g>
<g class="wordmark" transform="translate(0 0)">
 <text x="94" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="142" letter-spacing="3" fill="#F5EDE4">DT—09</text>
 <path d="M100 251H610" stroke="url(#amber)" stroke-width="2"/>
 <text x="100" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5" fill="#D47A3B">INDEPENDENT SYSTEMS ENGINEERING</text>
</g>
<g font-family="monospace" font-size="19" letter-spacing="2" fill="#F5EDE4">
 <text class="reveal" x="100" y="385">APPLIED AI  /  SOFTWARE  /  DATA  /  ENGINEERING</text>
 <rect class="cursor" x="100" y="365" width="2" height="28" fill="#F9AD6A"/>
</g>
<text x="100" y="449" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#858995">RESEARCH · DESIGN · IMPLEMENTATION · VERIFICATION</text>
<path d="M70 500H1530" stroke="#D47A3B" stroke-opacity=".3"/>
<text x="72" y="524" fill="#777B87" font-family="monospace" font-size="10" letter-spacing="2">CURIOSITY / PRECISION / EVIDENCE</text>
<text x="1528" y="524" fill="#777B87" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="2">DT—09</text>
</svg>