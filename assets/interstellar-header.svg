<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
<title id="title">DT—09 — The work begins with a question</title>
<desc id="desc">An interstellar black-hole study with a luminous accretion ring, gravitational lensing arcs, fine coordinate grids and oversized editorial typography.</desc>
<defs>
