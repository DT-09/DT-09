 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9AD6A" stop-opacity="0"/><stop offset=".28" stop-color="#D47A3B"/><stop offset=".52" stop-color="#F6D0A4"/><stop offset=".76" stop-color="#B75D2F"/><stop offset="1" stop-color="#D47A3B" stop-opacity="0"/></linearGradient>
