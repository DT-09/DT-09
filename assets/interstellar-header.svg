<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">DT—09 — Independent systems engineering</title>
<desc id="desc">A restrained editorial and astronomical composition. A large serif wordmark sits beside a precise orbital diagram, on a midnight field with bronze and amber details.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030305"/><stop offset=".58" stop-color="#0B0D13"/><stop offset="1" stop-color="#161B26"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D47A3B"/><stop offset=".55" stop-color="#F9AD6A"/><stop offset="1" stop-color="#F4D2B4"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#D47A3B" stop-opacity=".16"/><stop offset="1" stop-color="#D47A3B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#F5EDE4" stroke-opacity=".035"/></pattern>
 <style>
 .orbit{fill:none;stroke:#F9AD6A;stroke-opacity:.38;stroke-width:1.1}
 .orbit2{fill:none;stroke:#D47A3B;stroke-opacity:.35;stroke-width:1;stroke-dasharray:4 10;animation:drift 40s linear infinite}
 .word{opacity:0;animation:rise 1.1s cubic-bezier(.16,1,.3,1) .12s forwards}
 .rule{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.5s ease-out .4s forwards}
 .spark{animation:pulse 4s ease-in-out infinite}
 @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(20px)}}
 @keyframes draw{to{stroke-dashoffset:0}}
 @keyframes drift{to{stroke-dashoffset:-560}}
 @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.word{opacity:1;animation:none}.rule{stroke-dashoffset:0;animation:none}.orbit2,.spark{animation:none}}
 </style>
</defs>
<rect width="1600" height="500" fill="url(#bg)"/><rect width="1600" height="500" fill="url(#grid)"/>
<circle cx="1190" cy="235" r="290" fill="url(#halo)"/>
<g transform="translate(1190 230)">
 <circle r="188" class="orbit"/><ellipse rx="252" ry="112" transform="rotate(-28)" class="orbit"/>
 <ellipse rx="252" ry="112" transform="rotate(28)" class="orbit2"/>
 <ellipse rx="300" ry="158" transform="rotate(62)" class="orbit2" opacity=".6"/>
 <path d="M-315 0H315M0 -250V250" stroke="#F5EDE4" stroke-opacity=".08"/>
 <circle r="54" fill="#0B0D13" stroke="url(#amber)" stroke-width="1.5"/>
 <circle r="39" fill="none" stroke="#F9AD6A" stroke-opacity=".35"/>
 <path d="M-28 0H28M0 -28V28" stroke="#F9AD6A" stroke-opacity=".45"/>
 <circle r="5" fill="#F9AD6A"/>
 <circle cx="188" cy="0" r="4" fill="#F9AD6A" class="spark"/>
 <circle cx="-126" cy="-154" r="3" fill="#D47A3B" class="spark"/>
 <circle cx="104" cy="218" r="3" fill="#F9AD6A" class="spark"/>
</g>
<g class="word">
 <text x="100" y="210" fill="#F5EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="150" letter-spacing="-5">DT—09</text>
 <path class="rule" d="M108 250H640" stroke="url(#amber)" stroke-width="2"/>
 <text x="108" y="294" fill="#D47A3B" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="5">INDEPENDENT SYSTEMS ENGINEERING</text>
 <text x="108" y="368" fill="#F5EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-style="italic">Between the abstract</text>
 <text x="108" y="408" fill="#F5EDE4" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-style="italic">and the engineered.</text>
</g>
<path d="M72 458H1528" stroke="#D47A3B" stroke-opacity=".35"/>
<text x="76" y="482" fill="#858995" font-family="monospace" font-size="10" letter-spacing="3">MATHEMATICS / APPLIED AI / SOFTWARE / DATA / SYSTEMS</text>
<text x="1524" y="482" fill="#858995" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="3">INQUIRE · CONSTRUCT · VERIFY</text>
</svg>