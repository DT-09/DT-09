<text x="92" y="82" fill="#F9AD6A" font-family="monospace" font-size="12" letter-spacing="5">DT—09  /  INDEPENDENT INQUIRY</text>
<text x="82" y="250" fill="#F4EEE5" font-family="Georgia,serif" font-size="116" letter-spacing="-6">The work begins</text>
