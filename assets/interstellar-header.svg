<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
<title id="title">DT—09 — Beyond the event horizon</title>
<desc id="desc">A black-hole observatory illustration with an orange accretion disk, cyan orbital geometry, coordinate grids, stars and editorial typography.</desc>
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05050A"/><stop offset=".55" stop-color="#0B1220"/><stop offset="1" stop-color="#05050A"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#FF8C00" stop-opacity=".28"/><stop offset=".45" stop-color="#00CED1" stop-opacity=".07"/><stop offset="1" stop-color="#05050A" stop-opacity="0"/></radialGradient>
 <linearGradient id="plasma"><stop stop-color="#FF8C00" stop-opacity="0"/><stop offset=".22" stop-color="#FF8C00"/><stop offset=".48" stop-color="#F0F8FF"/><stop offset=".72" stop-color="#00CED1"/><stop offset="1" stop-color="#00CED1" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A8C0D8" stroke-opacity=".08"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1800" height="620" fill="url(#space)"/><rect width="1800" height="620" fill="url(#grid)"/>
<g stroke="#00CED1" stroke-opacity=".2" fill="none"><path d="M0 92H1800M0 530H1800M140 0V620M1680 0V620" stroke-dasharray="2 9"/><ellipse cx="1350" cy="306" rx="530" ry="210" transform="rotate(-22 1350 306)"/><ellipse cx="1350" cy="306" rx="470" ry="160" transform="rotate(20 1350 306)"/></g>
<circle cx="1350" cy="306" r="370" fill="url(#halo)"/>
<ellipse cx="1350" cy="306" rx="355" ry="105" transform="rotate(-19 1350 306)" fill="none" stroke="#FF8C00" stroke-width="28" stroke-opacity=".18" filter="url(#blur)"/>
<ellipse cx="1350" cy="306" rx="340" ry="88" transform="rotate(-19 1350 306)" fill="none" stroke="url(#plasma)" stroke-width="9"/>
<ellipse cx="1350" cy="306" rx="280" ry="63" transform="rotate(-19 1350 306)" fill="none" stroke="#F0F8FF" stroke-opacity=".42" stroke-width="2"/>
<circle cx="1350" cy="306" r="112" fill="#020207"/><circle cx="1350" cy="306" r="120" fill="none" stroke="#00CED1" stroke-opacity=".55" stroke-width="2" filter="url(#glow)"/>
<g fill="#F0F8FF"><circle cx="1070" cy="130" r="1.5"/><circle cx="1600" cy="110" r="1.3"/><circle cx="1680" cy="450" r="1.5"/><circle cx="980" cy="430" r="1.2"/><circle cx="1490" cy="540" r="1.2"/><circle cx="1740" cy="235" r="1.1"/></g>
<g fill="#A8B7C8" font-family="monospace" font-size="10" letter-spacing="2"><text x="1480" y="72">FIELD 09 / EVENT HORIZON</text><text x="1480" y="90">RA 13h 30m / DEC +27°</text><text x="92" y="552">OBSERVATORY / 2026</text><text x="92" y="570">MATHEMATICS · COMPUTATION · SYSTEMS</text></g>
<text x="92" y="88" fill="#00CED1" font-family="monospace" font-size="12" letter-spacing="5">DT—09  /  INDEPENDENT INQUIRY</text>
<text x="82" y="270" fill="#F0F8FF" font-family="Georgia,serif" font-size="120" letter-spacing="-7">Beyond the</text>
<text x="88" y="388" fill="#FF8C00" font-family="Georgia,serif" font-size="118" font-style="italic" letter-spacing="-6">event horizon.</text>
<path d="M92 430H800" stroke="#00CED1" stroke-width="1" stroke-opacity=".8"/>
<text x="95" y="464" fill="#B8C7D7" font-family="monospace" font-size="11" letter-spacing="3">QUESTION · MODEL · BUILD · VERIFY</text>
