<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
<title id="title">DT—09 · Independent inquiry and computational systems</title>
<desc id="desc">A restrained orbital observatory: concentric amber orbital paths, a central luminous research point, fine coordinate grid and distant stars on an obsidian field.</desc>
<defs>
  <radialGradient id="field"><stop stop-color="#172033"/><stop offset=".62" stop-color="#090D17"/><stop offset="1" stop-color="#030305"/></radialGradient>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9AD6A" stop-opacity=".05"/><stop offset=".5" stop-color="#D47A3B" stop-opacity=".78"/><stop offset="1" stop-color="#F9AD6A" stop-opacity=".08"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A8B7C8" stroke-opacity=".07"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1600" height="440" fill="url(#field)"/><rect width="1600" height="440" fill="url(#grid)"/>
