</g>
<circle cx="1190" cy="220" r="25" fill="#D47A3B" opacity=".24" filter="url(#glow)"/><circle cx="1190" cy="220" r="5" fill="#F9AD6A"/>
<g fill="#F9AD6A"><circle cx="900" cy="104" r="3"/><circle cx="1450" cy="330" r="2.5"/></g>
