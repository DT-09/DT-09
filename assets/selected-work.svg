<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="t d">
<title id="t">Selected work — nine independent systems</title>
<desc id="d">An editorial project index with oversized kinetic numerals, fine technical grid lines, a moving bronze signal and nine indexed points.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030305"/><stop offset=".62" stop-color="#11141D"/><stop offset="1" stop-color="#21150F"/></linearGradient>
 <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8E482B"/><stop offset=".5" stop-color="#F9AD6A"/><stop offset="1" stop-color="#D47A3B"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F5EDE4" stroke-opacity=".045"/></pattern>
 <style>
 .n{font:italic 230px Georgia,serif;fill:#F5EDE4;letter-spacing:-18px;opacity:0;animation:enter 1.1s cubic-bezier(.16,1,.3,1) .1s forwards}
 .head{font:64px Georgia,serif;fill:#F5EDE4;letter-spacing:-2px;opacity:0;animation:enter 1s cubic-bezier(.16,1,.3,1) .35s forwards}
 .ey{font:11px monospace;letter-spacing:5px;fill:#D47A3B}
 .sub{font:12px monospace;letter-spacing:2px;fill:#A8A0A0}
 .trace{stroke:url(#hot);stroke-width:2;stroke-dasharray:760;stroke-dashoffset:760;animation:draw 2.2s ease-out .45s forwards}
 .points{opacity:0;animation:enter .8s ease-out .8s forwards}
 .pulse{animation:pulse 3s ease-in-out infinite}
 @keyframes enter{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(28px)}}
 @keyframes draw{to{stroke-dashoffset:0}}
 @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.n,.head,.points{opacity:1;animation:none}.trace{stroke-dashoffset:0;animation:none}.pulse{animation:none}}
 </style>
</defs>
<rect width="1600" height="300" fill="url(#bg)"/><rect width="1600" height="300" fill="url(#grid)"/>
<path d="M0 1H1600M0 299H1600" stroke="#D47A3B" stroke-opacity=".4"/>
<text x="70" y="54" class="ey">ARCHIVE / 09 SELECTED DIRECTIONS</text>
<text x="52" y="255" class="n">09</text>
<text x="440" y="166" class="head">Selected work.</text>
<text x="444" y="205" class="sub">INDEPENDENT BUILDS / RESEARCH / EXPERIMENTS</text>
<path class="trace" d="M445 232H1500" fill="none"/>
<g class="points" fill="#F9AD6A">
 <circle cx="445" cy="232" r="4" class="pulse"/><circle cx="575" cy="232" r="3"/><circle cx="705" cy="232" r="3" class="pulse"/><circle cx="835" cy="232" r="3"/><circle cx="965" cy="232" r="3" class="pulse"/><circle cx="1095" cy="232" r="3"/><circle cx="1225" cy="232" r="3" class="pulse"/><circle cx="1355" cy="232" r="3"/><circle cx="1485" cy="232" r="4" class="pulse"/>
</g>
<text x="1500" y="270" text-anchor="end" class="ey">FROM QUESTION TO IMPLEMENTATION</text>
</svg>