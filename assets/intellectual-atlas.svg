<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">The field of inquiry</title>
<desc id="desc">An editorial field map. A central question is connected through orbital geometry to mathematical structure, models, algorithms, systems, data, AI, design and evidence.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030305"/><stop offset=".55" stop-color="#0B0D13"/><stop offset="1" stop-color="#161B26"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D47A3B"/><stop offset=".5" stop-color="#F9AD6A"/><stop offset="1" stop-color="#D47A3B"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#F9AD6A" stop-opacity=".18"/><stop offset="1" stop-color="#D47A3B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#F5EDE4" stroke-opacity=".035"/></pattern>
 <style>
 .orbit{fill:none;stroke:#D47A3B;stroke-opacity:.28;stroke-width:1}
 .route{fill:none;stroke:url(#gold);stroke-width:1.5;stroke-dasharray:3 10;opacity:.75;animation:flow 42s linear infinite}
 .node{fill:#0B0D13;stroke:#D47A3B;stroke-width:1.3}
 .field{font:12px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#F5EDE4}
 .note{font:9px monospace;letter-spacing:1.6px;fill:#A6A1A0}
 .index{font:10px monospace;fill:#D47A3B;letter-spacing:2px}
 @keyframes flow{to{stroke-dashoffset:-520}}
 @media(prefers-reduced-motion:reduce){.route{animation:none}}
 </style>
</defs>
<rect width="1400" height="560" rx="18" fill="url(#bg)"/><rect width="1400" height="560" rx="18" fill="url(#grid)"/>
<text x="58" y="58" class="index">FIELD NOTES / 001</text>
<text x="58" y="98" fill="#F5EDE4" font-family="Georgia,serif" font-size="34">A question is rarely confined to one discipline.</text>
<text x="58" y="126" fill="#92939B" font-family="Arial" font-size="13">A connected field of inquiry — from first principles to observable systems.</text>
<circle cx="700" cy="326" r="230" fill="url(#core)"/>
<g class="orbit">
 <ellipse cx="700" cy="326" rx="565" ry="180"/>
 <ellipse cx="700" cy="326" rx="450" ry="136" transform="rotate(-25 700 326)"/>
 <ellipse cx="700" cy="326" rx="450" ry="136" transform="rotate(25 700 326)"/>
 <circle cx="700" cy="326" r="115" stroke-opacity=".5"/>
</g>
<g class="route">
 <path d="M700 326L190 220M700 326L430 185M700 326L970 185M700 326L1210 220M700 326L190 435M700 326L430 480M700 326L970 480M700 326L1210 435"/>
</g>
<g>
 <circle cx="700" cy="326" r="88" fill="#0B0D13" stroke="url(#gold)" stroke-width="2"/>
 <circle cx="700" cy="326" r="72" fill="none" stroke="#F9AD6A" stroke-opacity=".3"/>
 <path d="M700 263V389M637 326H763M655 281L745 371M745 281L655 371" stroke="#F9AD6A" stroke-opacity=".22"/>
 <circle cx="700" cy="326" r="7" fill="#F9AD6A"/>
 <text x="700" y="319" text-anchor="middle" fill="#F5EDE4" font-family="Georgia,serif" font-size="19">THE</text>
 <text x="700" y="345" text-anchor="middle" fill="#F9AD6A" font-family="monospace" font-size="12" letter-spacing="2">QUESTION</text>
</g>
<g>
 <circle class="node" cx="190" cy="220" r="39"/><text class="field" x="190" y="224" text-anchor="middle">MATH</text><text class="note" x="190" y="275" text-anchor="middle">STRUCTURE / PROOF</text><text class="index" x="135" y="164">01</text>
 <circle class="node" cx="430" cy="185" r="39"/><text class="field" x="430" y="189" text-anchor="middle">MODELS</text><text class="note" x="430" y="240" text-anchor="middle">ABSTRACTION / ASSUMPTIONS</text><text class="index" x="376" y="129">02</text>
 <circle class="node" cx="970" cy="185" r="39"/><text class="field" x="970" y="189" text-anchor="middle">ALGORITHMS</text><text class="note" x="970" y="240" text-anchor="middle">LOGIC / COMPUTATION</text><text class="index" x="916" y="129">03</text>
 <circle class="node" cx="1210" cy="220" r="39"/><text class="field" x="1210" y="224" text-anchor="middle">SYSTEMS</text><text class="note" x="1210" y="275" text-anchor="middle">ARCHITECTURE / EXECUTION</text><text class="index" x="1156" y="164">04</text>
 <circle class="node" cx="190" cy="435" r="39"/><text class="field" x="190" y="439" text-anchor="middle">DATA</text><text class="note" x="190" y="490" text-anchor="middle">SIGNAL / PROVENANCE</text><text class="index" x="135" y="380">05</text>
 <circle class="node" cx="430" cy="480" r="39"/><text class="field" x="430" y="484" text-anchor="middle">AI</text><text class="note" x="430" y="535" text-anchor="middle">EVALUATION / AUTHORITY</text><text class="index" x="376" y="424">06</text>
 <circle class="node" cx="970" cy="480" r="39"/><text class="field" x="970" y="484" text-anchor="middle">DESIGN</text><text class="note" x="970" y="535" text-anchor="middle">INTERACTION / CLARITY</text><text class="index" x="916" y="424">07</text>
 <circle class="node" cx="1210" cy="435" r="39"/><text class="field" x="1210" y="439" text-anchor="middle">EVIDENCE</text><text class="note" x="1210" y="490" text-anchor="middle">TESTS / TRACEABILITY</text><text class="index" x="1156" y="380">08</text>
</g>
<text x="1340" y="548" text-anchor="end" fill="#777B87" font-family="monospace" font-size="9" letter-spacing="2">DT—09 / THE FIELD IS CONNECTED</text>
</svg>