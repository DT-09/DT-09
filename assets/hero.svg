<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">DT-09 — Systems that prove themselves</title>
<desc id="desc">A bold editorial engineering banner with oversized ivory typography, a monumental gold 09, animated orbital geometry, signal lines, and a dark obsidian field.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090B"/><stop offset=".5" stop-color="#17130F"/><stop offset="1" stop-color="#050607"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6D4823"/><stop offset=".32" stop-color="#D7B878"/><stop offset=".62" stop-color="#9D713A"/><stop offset="1" stop-color="#E7D1A0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#B88945" stop-opacity=".25"/><stop offset="1" stop-color="#B88945" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#B88945" stroke-opacity=".12" stroke-width=".7"/></pattern>
  <style>
    .orbit{transform-origin:900px 290px;animation:spin 42s linear infinite}
    .signal{stroke-dasharray:4 13;animation:dash 18s linear infinite}
    .pulse{transform-origin:900px 290px;animation:breathe 8s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes dash{to{stroke-dashoffset:-340}}
    @keyframes breathe{to{opacity:.95;transform:scale(1.06)}}
    @media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse{animation:none}}
  </style>
</defs>
<rect width="1200" height="620" rx="18" fill="url(#bg)"/>
<rect width="1200" height="620" rx="18" fill="url(#grid)"/>
<circle cx="900" cy="290" r="360" fill="url(#glow)"/>
<g fill="none" stroke="url(#metal)">
  <circle class="pulse" cx="900" cy="290" r="245" stroke-width="1" stroke-opacity=".45"/>
  <circle class="orbit" cx="900" cy="290" r="205" stroke-width="1.2" stroke-dasharray="2 10" stroke-opacity=".8"/>
  <ellipse class="orbit" cx="900" cy="290" rx="285" ry="112" stroke-width="1" stroke-opacity=".55" transform="rotate(-32 900 290)"/>
  <ellipse cx="900" cy="290" rx="310" ry="138" stroke-width="1" stroke-opacity=".25" transform="rotate(48 900 290)"/>
  <path class="signal" d="M600 620L900 290 1200 68M680 620L930 340 1200 150" stroke-width="1.3" stroke-opacity=".8"/>
  <path d="M0 500H1200M0 510H1200" stroke-width=".7" stroke-opacity=".25"/>
  <path d="M780 0V620M900 0V620M1020 0V620" stroke-width=".7" stroke-opacity=".14"/>
</g>
<text x="748" y="388" fill="url(#metal)" opacity=".18" font-family="Arial,sans-serif" font-size="350" font-weight="900" letter-spacing="-28">09</text>
<circle cx="900" cy="290" r="5" fill="#F1D7A0"/>
<circle cx="1099" cy="220" r="4" fill="#D6B77D"/>
<circle cx="715" cy="450" r="3" fill="#D6B77D"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="66" y="68" fill="#D6B77D" font-family="monospace" font-size="13" letter-spacing="5">DT—09  /  INDEPENDENT SYSTEMS</text>
  <path d="M66 92H420" stroke="#B88945" stroke-width="2"/>
  <text x="58" y="205" fill="#F4EEE2" font-size="88" font-weight="900" letter-spacing="-5">BUILD</text>
  <text x="58" y="294" fill="#F4EEE2" font-size="88" font-weight="900" letter-spacing="-5">WHAT</text>
  <text x="58" y="383" fill="url(#metal)" font-size="88" font-weight="900" letter-spacing="-5">MATTERS.</text>
  <text x="66" y="433" fill="#C7BDAA" font-family="monospace" font-size="13" letter-spacing="2.2">AI SYSTEMS  /  SOFTWARE INFRASTRUCTURE</text>
  <text x="66" y="462" fill="#8E8578" font-family="monospace" font-size="11" letter-spacing="1.5">RECONCILIATION · ASSURANCE · AUTHORITY</text>
  <rect x="66" y="510" width="10" height="10" fill="#B88945"/>
  <text x="90" y="520" fill="#E8DCC5" font-family="monospace" font-size="12" letter-spacing="2">MAKE THE RESULT VISIBLE.</text>
  <text x="66" y="576" fill="#71685D" font-family="monospace" font-size="10" letter-spacing="2.4">CURRENT BUILD  /  LEDGERTRACE</text>
  <text x="1132" y="576" text-anchor="end" fill="#71685D" font-family="monospace" font-size="10" letter-spacing="2">EST. IN PUBLIC</text>
</g>
</svg>