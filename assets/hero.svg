<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Well done is better than well said — Benjamin Franklin</title><desc id="d">A restrained identity plate in ebony, walnut, oxblood, champagne, ivory and sage, with a dimensional orbital instrument.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0909"/><stop offset=".48" stop-color="#211B1A"/><stop offset="1" stop-color="#100E0D"/></linearGradient>
<linearGradient id="champ" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9C866F"/><stop offset=".42" stop-color="#E3D2B5"/><stop offset=".72" stop-color="#BDA98C"/><stop offset="1" stop-color="#F4EBDD"/></linearGradient>
<linearGradient id="ivory" x2="0" y2="1"><stop stop-color="#FFF9EF"/><stop offset="1" stop-color="#D8CCBA"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#744B46" stop-opacity=".38"/><stop offset=".56" stop-color="#88745F" stop-opacity=".12"/><stop offset="1" stop-color="#0A0909" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#D8CCBA" stroke-opacity=".055"/></pattern>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<style>.orbit{transform-origin:890px 275px;animation:orbit 56s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite alternate}.dash{stroke-dasharray:3 13;animation:dash 25s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{to{opacity:.25}}@keyframes dash{to{stroke-dashoffset:-300}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.dash{animation:none}}</style>
</defs>
<rect width="1200" height="560" rx="20" fill="url(#bg)"/><rect width="1200" height="560" rx="20" fill="url(#grid)"/><ellipse cx="890" cy="275" rx="370" ry="280" fill="url(#halo)"/>
<g fill="none" stroke="url(#champ)"><path d="M28 28H1172V532H28Z" stroke-opacity=".34"/><path d="M28 102H1172M28 464H1172" stroke-opacity=".12"/><path d="M662 28V532M1140 28V532" stroke-opacity=".1"/><path d="M48 48H184M48 48V86M1152 474V512H1114" stroke-width="2" stroke-opacity=".8"/></g>
<ellipse cx="890" cy="275" rx="228" ry="87" transform="rotate(-28 890 275)" fill="none" stroke="url(#champ)" stroke-opacity=".62" class="orbit"/><ellipse cx="890" cy="275" rx="220" ry="94" transform="rotate(54 890 275)" fill="none" stroke="#B8A99A" stroke-opacity=".48" class="orbit"/><circle cx="890" cy="275" r="190" fill="none" stroke="url(#champ)" stroke-dasharray="2 10" stroke-opacity=".64" class="orbit"/><circle cx="890" cy="275" r="145" fill="none" stroke="#9AA394" stroke-opacity=".3"/>
<g fill="none" stroke="#D9CBB6" stroke-opacity=".28"><path d="M652 275H1128M890 38V512"/><path d="M719 104L1061 446M1061 104L719 446"/><path d="M675 455L890 275 1110 92M706 45L890 275 1090 498" class="dash"/></g>
<circle cx="890" cy="275" r="74" fill="#C7B69D" opacity=".13" filter="url(#shadow)"/><circle cx="890" cy="275" r="34" fill="#302422" stroke="url(#champ)" stroke-opacity=".8"/><circle cx="890" cy="275" r="8" fill="#F5EBDD" class="pulse"/><circle cx="1055" cy="204" r="4" fill="#A5B09E"/><circle cx="755" cy="411" r="3" fill="#C58F7B"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="68" y="68" fill="#D9C8AD" font-family="monospace" font-size="12" letter-spacing="4">A PRINCIPLE OF THE WORK</text><path d="M68 89H422" stroke="url(#champ)" stroke-width="1.5"/><text x="68" y="258" fill="url(#ivory)" font-size="66" font-weight="700" letter-spacing="-2">Well done is</text><text x="68" y="336" fill="url(#ivory)" font-size="58" font-weight="700" letter-spacing="-2">better than well said.</text><text x="72" y="390" fill="#D7C3A8" font-size="17" font-weight="600" letter-spacing="3">— BENJAMIN FRANKLIN</text><text x="70" y="454" fill="#C3B9AB" font-family="monospace" font-size="11" letter-spacing="1.6">SOFTWARE · AI ASSURANCE · DATA SYSTEMS · INFRASTRUCTURE</text><path d="M70 490H490" stroke="#8D7770" stroke-opacity=".6"/><circle cx="76" cy="514" r="4" fill="#A5B09E"/><text x="92" y="518" fill="#E9E0D3" font-family="monospace" font-size="10" letter-spacing="2">SELECTED WORK</text><text x="1130" y="516" fill="#9B8E82" font-family="monospace" font-size="9" text-anchor="end" letter-spacing="2">FIELD NOTES / 009</text></g></svg>