<filter id="soft"><feGaussianBlur stdDeviation="22"/></filter><filter id="glow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.orbit2{transform-box:fill-box;transform-origin:center;animation:orbit 31s linear infinite reverse}.pulse{animation:pulse 4.5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.42}50%{opacity:.95}}@media(prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse{animation:none}}</style>
</defs>
