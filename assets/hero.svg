<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none" role="img" aria-labelledby="title desc">
<title id="title">DT-09 — Systems, under tension</title><desc id="desc">A dark technical field with an animated three-dimensional brass and ivory polyhedral structure, orbital traces, and system annotations.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#080A0D"/><stop offset=".52" stop-color="#11151A"/><stop offset="1" stop-color="#080A0D"/></linearGradient>
<linearGradient id="brass" x1="720" y1="70" x2="1050" y2="355" gradientUnits="userSpaceOnUse"><stop stop-color="#F5E1B2"/><stop offset=".36" stop-color="#C8A56A"/><stop offset=".72" stop-color="#77552E"/><stop offset="1" stop-color="#E6C990"/></linearGradient>
<linearGradient id="ice" x1="760" y1="80" x2="1020" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#F4F0E8" stop-opacity=".9"/><stop offset="1" stop-color="#8795A2" stop-opacity=".18"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#C8A56A" stop-opacity=".22"/><stop offset="1" stop-color="#C8A56A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#C7D0D9" stroke-opacity=".055" stroke-width=".7"/></pattern>
