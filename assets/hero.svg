<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
<title id="title">DT-09 — The Verification Atlas</title>
<desc id="desc">A living technical atlas connecting three project constellations: business outcome verification, AI assurance, and agent authority. Animated orbit paths, a scanning line, and luminous nodes create a layered 3D-inspired systems diagram.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#07090C"/><stop offset=".55" stop-color="#11171C"/><stop offset="1" stop-color="#080A0D"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0C9"/><stop offset=".35" stop-color="#D2A85E"/><stop offset=".7" stop-color="#80572D"/><stop offset="1" stop-color="#F2D69B"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E5F2F6"/><stop offset="1" stop-color="#698D9D"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#C8A56A" stop-opacity=".22"/><stop offset="1" stop-color="#C8A56A" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#B6C3CB" stroke-opacity=".075" stroke-width=".7"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <style>
 .spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
 .spinback{transform-box:fill-box;transform-origin:center;animation:spin 38s linear infinite reverse}
 .dash{animation:dash 14s linear infinite}
 .pulse{animation:pulse 3.2s ease-in-out infinite}
 .scan{animation:scan 7s ease-in-out infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes dash{to{stroke-dashoffset:-420}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @keyframes scan{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(210px);opacity:.55}}
 @media(prefers-reduced-motion:reduce){.spin,.spinback,.dash,.pulse,.scan{animation:none}}
 </style>
</defs>
<rect width="1280" height="520" rx="18" fill="url(#bg)"/><rect width="1280" height="520" rx="18" fill="url(#grid)"/>
<circle cx="920" cy="255" r="260" fill="url(#aura)" filter="url(#blur)"/>
<path d="M34 42H1246M34 478H1246" stroke="#C8A56A" stroke-opacity=".55"/>
<path d="M34 42V66M1246 42V66M34 454V478M1246 454V478" stroke="#D6B779"/>
<g fill="#A8B3BB" font-family="monospace" font-size="11" letter-spacing="2"><text x="54" y="29">DT—09 / INDEPENDENT SYSTEMS ATLAS</text><text x="1226" y="29" text-anchor="end">FIELD 009 · LIVE MODEL</text></g>
<g font-family="monospace">
 <text x="60" y="134" fill="#E8E6DF" font-size="17" letter-spacing="5">I BUILD SYSTEMS THAT</text>
 <text x="56" y="205" fill="#F4F0E7" font-size="59" font-weight="700" letter-spacing="-3">CAN BE</text>
 <text x="56" y="270" fill="url(#gold)" font-size="59" font-weight="700" letter-spacing="-3">VERIFIED.</text>
 <path d="M60 296H442" stroke="url(#gold)" stroke-width="2"/>
 <text x="60" y="331" fill="#C7D0D5" font-size="14" letter-spacing="1.4">BUSINESS OUTCOMES / AI ASSURANCE</text>
 <text x="60" y="355" fill="#C7D0D5" font-size="14" letter-spacing="1.4">AGENT AUTHORITY / SOFTWARE SYSTEMS</text>
 <text x="60" y="414" fill="#7F8B94" font-size="11" letter-spacing="2">LESS MAGIC. MORE MECHANISM.</text>
 <text x="60" y="438" fill="#7F8B94" font-size="10" letter-spacing="1.5">PYTHON · TYPESCRIPT · AUTOMATION · TESTING</text>
</g>
<!-- orbiting architecture -->
<g class="spin" opacity=".7"><ellipse cx="926" cy="260" rx="244" ry="88" transform="rotate(-27 926 260)" stroke="url(#gold)" stroke-width="1.1" stroke-dasharray="170 12 32 16"/><ellipse cx="926" cy="260" rx="225" ry="124" transform="rotate(49 926 260)" stroke="url(#blue)" stroke-width="1" stroke-dasharray="2 9"/></g>
<g class="spinback" opacity=".55"><ellipse cx="926" cy="260" rx="177" ry="215" transform="rotate(64 926 260)" stroke="#E8E6DF" stroke-opacity=".6" stroke-width=".8" stroke-dasharray="62 8 4 12"/></g>
<path d="M790 164L1030 163L1100 300L926 385L753 300Z" stroke="#D4B16F" stroke-opacity=".8" stroke-width="1.2" fill="#C8A56A" fill-opacity=".025"/>
<path d="M790 164L926 260L1030 163M1030 163L926 385M1100 300L926 260L753 300M790 164L753 300M926 260L926 385" stroke="url(#blue)" stroke-opacity=".72" stroke-width="1.1"/>
<path d="M790 164L1100 300M1030 163L753 300" stroke="#C8A56A" stroke-opacity=".3" stroke-dasharray="3 6"/>
<!-- center core -->
<g filter="url(#glow)">
 <path d="M926 206L974 233V288L926 315L878 288V233Z" fill="#11171C" stroke="url(#gold)" stroke-width="1.5"/>
 <path d="M926 206L974 233L926 260L878 233Z" fill="#D5B573" fill-opacity=".18" stroke="#D5B573" stroke-opacity=".65"/>
 <path d="M878 233L926 260V315L878 288Z" fill="#73909A" fill-opacity=".12" stroke="#9FB3BB" stroke-opacity=".65"/>
 <path d="M926 260L974 233V288L926 315Z" fill="#C8A56A" fill-opacity=".08" stroke="#D5B573" stroke-opacity=".7"/>
 <circle cx="926" cy="260" r="11" fill="#0A0D10" stroke="#F2D69B" stroke-width="1.5"/><circle cx="926" cy="260" r="3.8" fill="#F2D69B" class="pulse"/>
</g>
<!-- project satellites -->
<g font-family="monospace">
 <path d="M790 164L717 125H654" stroke="#D2A85E" stroke-width="1"/><circle cx="790" cy="164" r="5" fill="#D2A85E" class="pulse"/>
 <rect x="622" y="94" width="186" height="42" rx="5" fill="#14181B" stroke="#9D7A42"/><text x="636" y="111" fill="#D2A85E" font-size="9" letter-spacing="1.4">01 / VENTURELABS</text><text x="636" y="126" fill="#E6E2D9" font-size="10">OUTCOME VERIFICATION</text>
 <path d="M1030 163L1090 121H1150" stroke="#9FB3BB" stroke-width="1"/><circle cx="1030" cy="163" r="5" fill="#9FB3BB" class="pulse"/>
 <rect x="1042" y="79" width="184" height="42" rx="5" fill="#14181B" stroke="#647F8C"/><text x="1055" y="96" fill="#A8C3CE" font-size="9" letter-spacing="1.2">02 / AI ASSURANCE</text><text x="1055" y="111" fill="#E6E2D9" font-size="10">WORKFLOW CHECKS</text>
 <path d="M1100 300L1155 345H1195" stroke="#D2A85E" stroke-width="1"/><circle cx="1100" cy="300" r="5" fill="#D2A85E" class="pulse"/>
 <rect x="1010" y="344" width="216" height="42" rx="5" fill="#14181B" stroke="#9D7A42"/><text x="1023" y="361" fill="#D2A85E" font-size="9" letter-spacing="1.1">03 / AURELIS AUTHORITY</text><text x="1023" y="376" fill="#E6E2D9" font-size="10">AGENT PERMISSION BOUNDARIES</text>
</g>
<path d="M60 465H1220" stroke="#AEB8BE" stroke-opacity=".2"/><path class="scan" d="M630 465H1220" stroke="#D2A85E" stroke-width="1.5"/>
<g fill="#74818A" font-family="monospace" font-size="9" letter-spacing="1.5"><text x="60" y="496">FIG. 009 — SYSTEMS UNDER TEST</text><text x="1220" y="496" text-anchor="end">POLICY / STATE / EVIDENCE</text></g>
</svg>