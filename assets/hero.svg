<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">DT-09 — Build systems. Show evidence.</title>
<desc id="desc">An animated obsidian hero with flowing golden-brown contours, a quiet orbital system, and ivory typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#100E0B"/><stop offset=".56" stop-color="#17130F"/><stop offset="1" stop-color="#090A0B"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop stop-color="#9C6B2F" stop-opacity=".22"/><stop offset="1" stop-color="#9C6B2F" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6D4823" stop-opacity=".1"/><stop offset=".5" stop-color="#B88945" stop-opacity=".85"/><stop offset="1" stop-color="#D6B77D" stop-opacity=".12"/>
  </linearGradient>
  <style>
    .halo{transform-origin:930px 180px;animation:pulse 9s ease-in-out infinite alternate}
    .flow{stroke-dasharray:7 11;animation:drift 24s linear infinite}
    .orbit{transform-origin:930px 184px;animation:rotate 46s linear infinite}
    @keyframes pulse{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.13)}}
    @keyframes drift{to{stroke-dashoffset:-360}}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.halo,.flow,.orbit{animation:none}}
  </style>
</defs>
<rect width="1200" height="390" rx="14" fill="url(#bg)"/>
<circle class="halo" cx="930" cy="180" r="260" fill="url(#halo)"/>
<g fill="none" stroke="url(#gold)" stroke-width="1">
  <path d="M640 0V390M720 0V390M800 0V390M880 0V390M960 0V390M1040 0V390M1120 0V390" opacity=".18"/>
  <path d="M610 60H1200M610 120H1200M610 180H1200M610 240H1200M610 300H1200M610 360H1200" opacity=".15"/>
  <path class="orbit" d="M700 184C700 91 802 38 930 38S1160 91 1160 184 1058 330 930 330 700 277 700 184Z" stroke-dasharray="2 9" opacity=".75"/>
  <path class="flow" d="M650 390C760 290 820 250 930 184S1090 75 1180 0" opacity=".85"/>
  <path d="M700 390C790 300 860 245 930 184S1070 80 1120 0" opacity=".45"/>
  <path class="flow" d="M730 390C830 300 880 250 960 190S1100 100 1200 60" opacity=".35"/>
</g>
<circle cx="930" cy="184" r="4" fill="#D6B77D"/>
<circle cx="1180" cy="0" r="3" fill="#B88945"/>
<circle cx="650" cy="390" r="3" fill="#B88945"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="66" y="62" fill="#B88945" font-size="11" letter-spacing="3.4">DT—09 / INDEPENDENT BUILDER</text>
  <text x="62" y="147" fill="#F1E9D8" font-size="43" font-weight="700" letter-spacing="-1.9">BUILD SYSTEMS.</text>
  <text x="62" y="201" fill="#B88945" font-size="43" font-weight="700" letter-spacing="-1.9">SHOW EVIDENCE.</text>
  <path d="M66 226H435" stroke="#B88945" stroke-opacity=".72"/>
  <text x="66" y="258" fill="#E5DCCB" font-size="12" letter-spacing="1.35">AI SYSTEMS · SOFTWARE INFRASTRUCTURE</text>
  <text x="66" y="284" fill="#B8AD9A" font-size="11" letter-spacing="1.2">RECONCILIATION / ASSURANCE / AUTHORITY</text>
  <rect x="66" y="318" width="5" height="5" fill="#B88945"/>
  <text x="82" y="324" fill="#A99B86" font-size="10" letter-spacing="2">CURRENT FOCUS: LEDGERTRACE</text>
</g>
</svg>