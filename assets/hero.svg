<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">DT—09 — Engineering with intent</title><desc id="d">An obsidian and oxblood architectural field with champagne-gold contour geometry, a luminous central instrument and elegant editorial typography.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090807"/><stop offset=".48" stop-color="#211716"/><stop offset="1" stop-color="#0B0909"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80603D"/><stop offset=".35" stop-color="#E8D1A3"/><stop offset=".68" stop-color="#B18A5D"/><stop offset="1" stop-color="#F1E2C3"/></linearGradient>
 <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF8EC"/><stop offset="1" stop-color="#CFC2AC"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#B48A5A" stop-opacity=".25"/><stop offset=".58" stop-color="#6D3931" stop-opacity=".12"/><stop offset="1" stop-color="#100C0B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#D6B987" stroke-opacity=".09" stroke-width=".7"/></pattern>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
 <style>
 .orbit{transform-origin:890px 275px;animation:turn 48s linear infinite}
 .signal{animation:pulse 4s ease-in-out infinite alternate}
 .sweep{stroke-dasharray:4 12;animation:dash 22s linear infinite}
 @keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{to{opacity:.28}}@keyframes dash{to{stroke-dashoffset:-300}}
 @media(prefers-reduced-motion:reduce){.orbit,.signal,.sweep{animation:none}}
 </style>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/><rect width="1200" height="560" rx="18" fill="url(#grid)"/>
<ellipse cx="890" cy="274" rx="365" ry="280" fill="url(#halo)"/>
<g fill="none" stroke="url(#gold)"><path d="M28 28H1172V532H28Z" stroke-opacity=".48"/><path d="M28 102H1172M28 464H1172" stroke-opacity=".17"/><path d="M662 28V532M1140 28V532" stroke-opacity=".13"/><path d="M48 48H184M48 48V86M1152 474V512H1114" stroke-width="2"/></g>
<ellipse cx="890" cy="275" rx="228" ry="87" transform="rotate(-28 890 275)" fill="none" stroke="url(#gold)" stroke-opacity=".56" class="orbit"/>
<ellipse cx="890" cy="275" rx="220" ry="94" transform="rotate(54 890 275)" fill="none" stroke="#E4D0A7" stroke-opacity=".38" class="orbit"/>
<circle cx="890" cy="275" r="190" fill="none" stroke="url(#gold)" stroke-dasharray="2 9" stroke-opacity=".7" class="orbit"/>
<circle cx="890" cy="275" r="145" fill="none" stroke="#D8BC8C" stroke-opacity=".22"/>
<g fill="none" stroke="url(#gold)" stroke-opacity=".45"><path d="M652 275H1128M890 38V512"/><path d="M719 104L1061 446M1061 104L719 446"/><path d="M675 455L890 275 1110 92M706 45L890 275 1090 498" class="sweep"/></g>
<circle cx="890" cy="275" r="72" fill="#B68C5B" opacity=".12" filter="url(#shadow)"/><circle cx="890" cy="275" r="32" fill="none" stroke="url(#gold)" stroke-opacity=".7"/><circle cx="890" cy="275" r="8" fill="#F4E4C3" class="signal"/><circle cx="1055" cy="204" r="4" fill="#E8D1A3"/><circle cx="755" cy="411" r="3" fill="#D0A873"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="68" y="68" fill="#D8BC8C" font-family="monospace" font-size="12" letter-spacing="4">INDEPENDENT ENGINEERING / DT—09</text><path d="M68 89H422" stroke="url(#gold)" stroke-width="2"/>
<text x="58" y="224" fill="url(#ivory)" font-size="104" font-weight="800" letter-spacing="-7">SYSTEMS</text><text x="58" y="320" fill="url(#ivory)" font-size="104" font-weight="800" letter-spacing="-7">WITH</text><text x="58" y="416" fill="url(#gold)" font-size="104" font-weight="800" letter-spacing="-7">SUBSTANCE.</text>
<text x="70" y="454" fill="#D8CDBB" font-family="monospace" font-size="11" letter-spacing="1.6">SOFTWARE · AI ASSURANCE · DATA SYSTEMS · INFRASTRUCTURE</text><path d="M70 490H490" stroke="#B18A5D" stroke-opacity=".5"/><circle cx="76" cy="514" r="4" fill="#D8BC8C"/><text x="92" y="518" fill="#E9DDC9" font-family="monospace" font-size="10" letter-spacing="2">DESIGNED TO BE INSPECTED.</text><text x="1130" y="516" fill="#8B7965" font-family="monospace" font-size="9" text-anchor="end" letter-spacing="2">FIELD NOTES / 009</text></g></svg>