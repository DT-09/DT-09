<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="92" viewBox="0 0 1600 92" role="img" aria-label="Moving typographic sequence: inquire, imagine, model, build, test, refine.">
<defs><linearGradient id="line" x2="1"><stop stop-color="#D47A3B" stop-opacity="0"/><stop offset=".25" stop-color="#D47A3B"/><stop offset=".75" stop-color="#F9AD6A"/><stop offset="1" stop-color="#D47A3B" stop-opacity="0"/></linearGradient><style>
.track{animation:travel 34s linear infinite}
.ghost{animation:fade 5s ease-in-out infinite alternate}
@keyframes travel{to{transform:translateX(-800px)}}
@keyframes fade{from{opacity:.14}to{opacity:.42}}
@media(prefers-reduced-motion:reduce){.track{animation:none}.ghost{animation:none;opacity:.3}}
</style></defs>
<rect width="1600" height="92" fill="#030305"/>
<path d="M0 12H1600M0 80H1600" stroke="#D47A3B" stroke-opacity=".22"/>
<g class="track" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-style="italic" fill="#F5EDE4" letter-spacing="2">
 <text x="0" y="59">INQUIRE <tspan fill="#D47A3B">✳</tspan> IMAGINE <tspan fill="#D47A3B">✳</tspan> MODEL <tspan fill="#D47A3B">✳</tspan> BUILD <tspan fill="#D47A3B">✳</tspan> TEST <tspan fill="#D47A3B">✳</tspan> REFINE <tspan fill="#D47A3B">✳</tspan> INQUIRE <tspan fill="#D47A3B">✳</tspan> IMAGINE <tspan fill="#D47A3B">✳</tspan> MODEL <tspan fill="#D47A3B">✳</tspan> BUILD <tspan fill="#D47A3B">✳</tspan> TEST <tspan fill="#D47A3B">✳</tspan> REFINE</text>
</g><text class="ghost" x="1530" y="26" text-anchor="end" font-family="monospace" font-size="9" fill="#F9AD6A" letter-spacing="4">A CONTINUOUS PROCESS / DT—09</text>
</svg>