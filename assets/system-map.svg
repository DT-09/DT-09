<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">DT-09 engineering system map</title>
<desc id="desc">Three connected engineering pillars: business data reconciliation, AI workflow assurance, and agent authority controls.</desc>
<defs>
 <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0B0D"/><stop offset="1" stop-color="#17130F"/></linearGradient>
 <linearGradient id="g"><stop stop-color="#7D542B"/><stop offset=".5" stop-color="#D6B77D"/><stop offset="1" stop-color="#8E6334"/></linearGradient>
 <style>.line{stroke-dasharray:5 8;animation:move 20s linear infinite}@keyframes move{to{stroke-dashoffset:-260}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style>
</defs>
<rect width="1200" height="300" rx="14" fill="url(#b)"/>
<g fill="none" stroke="url(#g)" stroke-width="1.2"><path class="line" d="M180 146H1020"/><path d="M400 146H800" stroke-opacity=".4"/><circle cx="200" cy="146" r="62"/><circle cx="600" cy="146" r="62"/><circle cx="1000" cy="146" r="62"/></g>
<g fill="#D6B77D" font-family="monospace" font-size="10" letter-spacing="2"><text x="200" y="63" text-anchor="middle">01 / DATA</text><text x="600" y="63" text-anchor="middle">02 / BEHAVIOR</text><text x="1000" y="63" text-anchor="middle">03 / AUTHORITY</text></g>
<g fill="#F1E9D8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="200" y="151">RECONCILE</text><text x="600" y="151">VERIFY</text><text x="1000" y="151">CONTROL</text></g>
<g fill="#9C9282" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="middle"><text x="200" y="174">LEDGERTRACE</text><text x="600" y="174">AI ASSURANCE</text><text x="1000" y="174">AURELIS AUTHORITY</text></g>
<g fill="#B88945"><circle cx="200" cy="146" r="3"/><circle cx="600" cy="146" r="3"/><circle cx="1000" cy="146" r="3"/></g>
<text x="600" y="258" fill="#82786A" font-family="monospace" font-size="11" letter-spacing="3" text-anchor="middle">ONE PRINCIPLE: MAKE IMPORTANT OUTCOMES INSPECTABLE.</text>
</svg>