<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">DT—09 engineering map</title><desc id="d">Three connected pillars: reconcile data, verify outcomes, govern authority.</desc>
