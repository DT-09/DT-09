<g font-family="monospace" font-size="10" letter-spacing="2" fill="#CDB58C" text-anchor="middle"><text x="200" y="65">01 / DATA</text><text x="600" y="65">02 / OUTCOMES</text><text x="1000" y="65">03 / AUTHORITY</text></g>
<g fill="#F2EBDD" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="200" y="155">RECONCILE</text><text x="600" y="155">VERIFY</text><text x="1000" y="155">GOVERN</text></g>
<g fill="#A99A85" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="middle"><text x="200" y="178">LEDGERTRACE · VERITY</text><text x="600" y="178">PACELAB · AURELIS</text><text x="1000" y="178">AUTHORITY · ACI</text></g>
