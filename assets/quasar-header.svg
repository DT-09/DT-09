<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">QUASAR — independent systems engineering</title>
<desc id="desc">A black hole and luminous accretion disk inspired by the distant quasar TON 618, with restrained intermittent typographic interference.</desc>
<defs>
  <radialGradient id="space"><stop offset="0" stop-color="#17112c"/><stop offset=".48" stop-color="#090914"/><stop offset="1" stop-color="#030407"/></radialGradient>
  <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2ff"/><stop offset=".18" stop-color="#8f79ff"/><stop offset=".43" stop-color="#32c8ff"/><stop offset=".68" stop-color="#a34fff"/><stop offset="1" stop-color="#f4b7ff"/></linearGradient>
  <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7f4ff"/><stop offset=".55" stop-color="#c9c1ff"/><stop offset="1" stop-color="#8ce8ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
  <clipPath id="diskclip"><ellipse cx="850" cy="154" rx="265" ry="78"/></clipPath>
</defs>
<rect width="1200" height="310" fill="url(#space)"/>
<g fill="#d9d5ff" opacity=".7">
<circle cx="65" cy="55" r="1.2"/><circle cx="185" cy="235" r="1"/><circle cx="340" cy="62" r=".9"/><circle cx="490" cy="260" r="1.2"/><circle cx="1100" cy="42" r="1"/><circle cx="1140" cy="245" r="1.3"/><circle cx="1010" cy="278" r=".8"/><circle cx="730" cy="32" r=".8"/><circle cx="580" cy="95" r=".8"/>
</g>
<g opacity=".35" stroke="#7664cf" fill="none"><path d="M610 35 C760 -15 1040 8 1160 112"/><path d="M600 278 C790 335 1080 295 1180 194"/></g>
<g transform="translate(850 154)">
  <ellipse rx="290" ry="90" fill="none" stroke="#6950d9" stroke-width="2" opacity=".24"/>
  <ellipse rx="260" ry="77" fill="none" stroke="#a18aff" stroke-width="18" opacity=".25" filter="url(#glow)"/>
  <ellipse rx="255" ry="73" fill="none" stroke="url(#disk)" stroke-width="8" opacity=".92"/>
  <ellipse rx="205" ry="58" fill="none" stroke="#d9d2ff" stroke-width="2" opacity=".72" filter="url(#soft)"/>
  <ellipse rx="145" ry="43" fill="none" stroke="#7f67e8" stroke-width="14" opacity=".45" filter="url(#glow)"/>
  <circle r="67" fill="#020207"/>
  <circle r="71" fill="none" stroke="#b7aaff" stroke-width="2" opacity=".55"/>
</g>
<path d="M850 73 L850 5" stroke="#b9aaff" stroke-width="2" opacity=".45"/>
<path d="M850 235 L850 304" stroke="#b9aaff" stroke-width="2" opacity=".35"/>
<g transform="translate(78 0)">
  <text x="0" y="143" font-family="Georgia,serif" font-size="78" letter-spacing="12" fill="url(#type)">QUASAR</text>
  <text x="4" y="184" font-family="monospace" font-size="13" letter-spacing="4" fill="#aaa4c9">INDEPENDENT SYSTEMS ENGINEERING</text>
  <path d="M4 210 H360" stroke="#6255a5" stroke-width="1"/>
  <text x="4" y="239" font-family="monospace" font-size="10" letter-spacing="2.6" fill="#7d789c">RESEARCH  /  ENGINEERING  /  VERIFICATION</text>
  <g font-family="Georgia,serif" font-size="78" letter-spacing="12" fill="#72dfff" opacity="0" class="glitch">
    <text x="3" y="143">QUASAR</text>
  </g>
</g>
<style>
.glitch { animation: interference 9s infinite; }
@keyframes interference {
  0%,91%,93%,95%,100% { opacity:0; transform:translate(0,0); }
  91.4% { opacity:.72; transform:translate(3px,-1px); }
  92% { opacity:0; transform:translate(-2px,1px); }
  93.4% { opacity:.48; transform:translate(-4px,0); }
  94% { opacity:0; transform:translate(1px,0); }
}
</style>
</svg>