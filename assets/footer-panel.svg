<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="390" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
<title id="title">DT—09 — Think. Build. Verify.</title>
<desc id="desc">A dynamic closing composition with oversized editorial typography, a moving technical ticker, layered orbital lines and a bronze-to-midnight gradient.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1B100D"/><stop offset=".42" stop-color="#241711"/><stop offset="1" stop-color="#0B1019"/></linearGradient>
 <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F5EDE4"/><stop offset=".48" stop-color="#F9AD6A"/><stop offset="1" stop-color="#D47A3B"/></linearGradient>
 <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D47A3B" stop-opacity="0"/><stop offset=".48" stop-color="#F9AD6A" stop-opacity=".8"/><stop offset="1" stop-color="#D47A3B" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#F5EDE4" stroke-opacity=".035"/></pattern>
 <style>
 .display{font-family:Georgia,'Times New Roman',serif;font-weight:400;fill:#F5EDE4;letter-spacing:-4px}
 .think{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) .1s forwards}
 .build{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) .3s forwards}
 .verify{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) .5s forwards}
 .beam{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 2.2s ease-out .6s forwards}
 .marquee{animation:slide 32s linear infinite}
 .orbit{fill:none;stroke:#D47A3B;stroke-opacity:.22;stroke-width:1}
 .orbital{stroke-dasharray:3 12;animation:orbit 42s linear infinite}
 .cross{animation:blink 3.5s ease-in-out infinite}
 @keyframes up{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}
 @keyframes draw{to{stroke-dashoffset:0}}
 @keyframes slide{to{transform:translateX(-50%)}}
 @keyframes orbit{to{stroke-dashoffset:-600}}
 @keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}
 @media(prefers-reduced-motion:reduce){.think,.build,.verify{opacity:1;animation:none}.beam{stroke-dashoffset:0;animation:none}.marquee,.orbital,.cross{animation:none}}
 </style>
</defs>
<rect width="1600" height="390" fill="url(#bg)"/><rect width="1600" height="390" fill="url(#grid)"/>
<path d="M0 26H1600" stroke="url(#trace)" stroke-width="2"/>
<text x="76" y="66" fill="#D47A3B" font-family="monospace" font-size="10" letter-spacing="5">DT—09  /  THE WORK CONTINUES</text>
<g class="think"><text x="74" y="170" class="display" font-size="94">THINK.</text></g>
<g class="build"><text x="480" y="170" class="display" font-size="94" font-style="italic" fill="#F9AD6A">BUILD.</text></g>
<g class="verify"><text x="920" y="170" class="display" font-size="94">VERIFY.</text></g>
<path class="beam" d="M80 198H1518" fill="none" stroke="url(#type)" stroke-width="1.6"/>
<g transform="translate(1375 280)">
 <circle r="78" class="orbit"/><ellipse rx="120" ry="45" transform="rotate(-35)" class="orbit orbital"/><ellipse rx="120" ry="45" transform="rotate(35)" class="orbit"/>
 <path d="M-142 0H142M0 -142V142" class="orbit"/>
 <circle r="4" fill="#F9AD6A" class="cross"/><circle cx="78" cy="0" r="3" fill="#D47A3B" class="cross"/>
</g>
<text x="82" y="252" fill="#E8D8CC" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">NO BLACK BOXES. NO EMPTY CLAIMS.</text>
<text x="82" y="280" fill="#9D9290" font-family="monospace" font-size="10" letter-spacing="2">SHOW THE MODEL. TEST THE MECHANISM. TRACE THE RESULT.</text>
<path d="M80 316H1520" stroke="#F5EDE4" stroke-opacity=".18"/>
<svg x="80" y="330" width="1440" height="26" viewBox="0 0 1440 26" overflow="hidden">
 <g class="marquee">
  <text x="0" y="18" fill="#D9A17E" font-family="monospace" font-size="11" letter-spacing="4">MATHEMATICS  /  COMPUTATION  /  AI  /  DATA  /  SYSTEMS  /  ENGINEERING  /  EVIDENCE  /  </text>
  <text x="1440" y="18" fill="#D9A17E" font-family="monospace" font-size="11" letter-spacing="4">MATHEMATICS  /  COMPUTATION  /  AI  /  DATA  /  SYSTEMS  /  ENGINEERING  /  EVIDENCE  /  </text>
 </g>
</svg>
<text x="82" y="382" fill="#8B817F" font-family="monospace" font-size="9" letter-spacing="3">INDEPENDENT SYSTEMS ENGINEERING</text>
<text x="1518" y="382" fill="#8B817F" font-family="monospace" font-size="9" text-anchor="end" letter-spacing="3">DT—09  ·  GITHUB</text>
</svg>